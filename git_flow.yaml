name: Build & Deploy
on:
  push:
    tags:
      - 'v*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t ranobe-pp-backend:${{ github.run_number }} -t ranobe-pp-backend:latest .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Send image to server
        run: |
          docker save ranobe-pp-backend:latest | ssh -i ~/.ssh/deploy_key test@${{ secrets.DEPLOY_HOST }} "docker load"

      - name: Deploy to Swarm
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml test@${{ secrets.DEPLOY_HOST }}:~/docker-compose.ranobe-pp-backend.yml
          ssh -i ~/.ssh/deploy_key test@${{ secrets.DEPLOY_HOST }} \
            "cd ~ && docker stack deploy -c docker-compose.ranobe-pp-backend.yml pp_back"

      - name: Force update service
        run: |
          ssh -i ~/.ssh/deploy_key test@${{ secrets.DEPLOY_HOST }} \
            "docker service update --image ranobe-pp-backend:latest --force pp_ranobe-pp-backend"