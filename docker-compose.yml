# ──────────────────────────────────────────────────────────
# docker-compose.yml — Swarm-ready
#
# Запуск:
#   docker stack deploy -c docker-compose.yml ranobe
#
# Или локально:
#   docker compose up -d
# ──────────────────────────────────────────────────────────

services:
  editor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
    image: ranobe-editor:latest
    ports:
      - "3098:80"
    networks:
      - ranobe
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  viewer:
    build:
      context: ./viewer-site
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
    image: ranobe-viewer:latest
    ports:
      - "3099:80"
    networks:
      - ranobe
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  ranobe:
    driver: overlay
    attachable: true
